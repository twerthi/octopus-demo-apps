# Builds one app's Docker image and pushes it to Docker Hub. The company workflows call this
# once per app. Pull requests build the image to check it, but don't push.
#
# Needs a repository secret named DOCKERHUB_TOKEN: a Docker Hub access token with write access
# to the twerthi organization. Set the DOCKERHUB_USERNAME repository variable to the account
# that owns the token.
name: Docker image

on:
  workflow_call:
    inputs:
      context:
        description: Company folder to build from, so Directory.Build.props is included
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile, relative to the context
        required: true
        type: string
      image:
        description: Image name without the namespace, for example kelpford-web
        required: true
        type: string

env:
  NAMESPACE: twerthi
  VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.NAMESPACE }}/${{ inputs.image }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push ${{ env.NAMESPACE }}/${{ inputs.image }}:${{ env.VERSION }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          build-args: VERSION=${{ env.VERSION }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
