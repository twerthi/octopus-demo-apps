<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scheduled maintenance · Shoalbridge Financial</title>
  <script src="/theme.js"></script>
  <link rel="icon" href="/images/logo-mark.svg" type="image/svg+xml">
  <style>
    :root { --bg: #f3f5f9; --surface: #fff; --text: #14213d; --muted: #5a6478; --accent: #c9a227; color-scheme: light; }
    :root[data-theme="dark"] { --bg: #0d1424; --surface: #151f35; --text: #e7ebf3; --muted: #9aa5bb; color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; align-content: center; gap: 1.5rem; background: var(--bg); color: var(--text);
           font-family: "Segoe UI", system-ui, -apple-system, sans-serif; padding: 1rem; }
    .card { max-width: 480px; background: var(--surface); border-top: 4px solid var(--accent); border-radius: 10px;
            padding: 2rem; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
    h1 { margin: 0 0 .75rem; font-size: 1.4rem; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 .75rem; }
    .theme-toggle { display: inline-grid; place-items: center; width: 2.1rem; height: 2.1rem; padding: 0;
                    border-radius: 999px; border: 1px solid var(--muted); background: var(--surface);
                    color: var(--text); cursor: pointer; position: fixed; top: 1rem; right: 1rem; }
    .theme-toggle:hover { border-color: var(--accent); }
    .theme-toggle svg { width: 1.1rem; height: 1.1rem; }
    :root[data-theme="dark"] .theme-toggle .moon, :root:not([data-theme="dark"]) .theme-toggle .sun { display: none; }
    .card > img { height: 48px; margin-bottom: 1rem; }
    :root[data-theme="dark"] .logo-light, :root:not([data-theme="dark"]) .logo-dark { display: none; }
    footer.powered { display: flex; justify-content: center; padding: 0; }
    footer.powered a { display: inline-flex; align-items: center; gap: .5rem; color: var(--muted);
                       font-size: .85rem; text-decoration: none; }
    footer.powered a:hover { color: var(--text); }
    footer.powered img { height: 22px; width: auto; }
    footer.powered strong { color: var(--text); font-weight: 600; }
  </style>
</head>
<body>
  <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Dark mode" aria-pressed="false" title="Toggle dark mode">
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 1.5V4M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
  </button>
  <div class="card">
    <img class="logo-light" src="/images/logo.svg" alt="Shoalbridge Financial">
    <img class="logo-dark" src="/images/logo-dark.svg" alt="Shoalbridge Financial">
    <h1>We’re making some improvements</h1>
    <p>Online banking is briefly unavailable while we complete scheduled maintenance. Your accounts and payments are safe.</p>
    <p>Please try again in a few minutes. For urgent help, call 1-800-555-0142.</p>
  </div>
  <footer class="powered">
    <a href="https://octopus.com" target="_blank" rel="noopener">
      <img src="/images/octopus-deploy.png" alt="">
      <span>Powered by <strong>Octopus Deploy</strong></span>
    </a>
  </footer>
</body>
</html>
